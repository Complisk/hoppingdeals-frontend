<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="18%" r="105%">
      <stop offset="0%" stop-color="#0B1440"/>
      <stop offset="42%" stop-color="#060D26"/>
      <stop offset="100%" stop-color="#02040A"/>
    </radialGradient>
    <radialGradient id="nebPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E31E24" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#E31E24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E31E24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24356E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#24356E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E31E24" stop-opacity="0"/>
      <stop offset="78%" stop-color="#7C3AED" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E31E24" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- deep space base -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- nebula clouds -->
  <g filter="url(#soft)">
    <ellipse cx="1330" cy="150" rx="520" ry="330" fill="url(#nebPurple)"/>
    <ellipse cx="150" cy="130" rx="430" ry="300" fill="url(#nebRed)"/>
    <ellipse cx="760" cy="40" rx="420" ry="240" fill="url(#nebBlue)" opacity="0.8"/>
    <ellipse cx="470" cy="470" rx="380" ry="260" fill="url(#nebPurple)" opacity="0.45"/>
  </g>

  <!-- glow behind the headline -->
  <ellipse cx="800" cy="300" rx="520" ry="300" fill="url(#centerGlow)"/>

  <!-- light beams from the city -->
  <g opacity="0.5">
    <polygon points="700,900 790,900 1120,60 980,60" fill="url(#beam)"/>
    <polygon points="860,900 950,900 620,60 480,60" fill="url(#beam)" opacity="0.7"/>
  </g>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="62" cy="88" r="1.6" opacity="0.85"/><circle cx="140" cy="212" r="1.1" opacity="0.5"/>
    <circle cx="228" cy="64" r="1.3" opacity="0.7"/><circle cx="318" cy="158" r="1" opacity="0.45"/>
    <circle cx="392" cy="52" r="1.7" opacity="0.9"/><circle cx="452" cy="236" r="1" opacity="0.4"/>
    <circle cx="512" cy="120" r="1.2" opacity="0.6"/><circle cx="586" cy="72" r="1.5" opacity="0.8"/>
    <circle cx="662" cy="188" r="1" opacity="0.45"/><circle cx="728" cy="36" r="1.3" opacity="0.7"/>
    <circle cx="806" cy="140" r="1.1" opacity="0.55"/><circle cx="878" cy="58" r="1.6" opacity="0.85"/>
    <circle cx="948" cy="206" r="1" opacity="0.4"/><circle cx="1022" cy="96" r="1.3" opacity="0.7"/>
    <circle cx="1098" cy="34" r="1.1" opacity="0.5"/><circle cx="1174" cy="164" r="1.5" opacity="0.8"/>
    <circle cx="1246" cy="82" r="1" opacity="0.45"/><circle cx="1318" cy="218" r="1.2" opacity="0.6"/>
    <circle cx="1386" cy="52" r="1.7" opacity="0.9"/><circle cx="1452" cy="150" r="1" opacity="0.5"/>
    <circle cx="1522" cy="96" r="1.3" opacity="0.7"/><circle cx="1568" cy="238" r="1" opacity="0.4"/>
    <circle cx="96" cy="318" r="1.2" opacity="0.55"/><circle cx="204" cy="388" r="1" opacity="0.4"/>
    <circle cx="288" cy="296" r="1.4" opacity="0.7"/><circle cx="376" cy="352" r="1" opacity="0.45"/>
    <circle cx="470" cy="308" r="1.2" opacity="0.6"/><circle cx="562" cy="398" r="1" opacity="0.4"/>
    <circle cx="648" cy="332" r="1.5" opacity="0.8"/><circle cx="742" cy="386" r="1" opacity="0.45"/>
    <circle cx="834" cy="318" r="1.2" opacity="0.6"/><circle cx="926" cy="372" r="1" opacity="0.4"/>
    <circle cx="1018" cy="296" r="1.4" opacity="0.7"/><circle cx="1108" cy="356" r="1" opacity="0.45"/>
    <circle cx="1196" cy="304" r="1.2" opacity="0.6"/><circle cx="1288" cy="392" r="1" opacity="0.4"/>
    <circle cx="1376" cy="330" r="1.5" opacity="0.75"/><circle cx="1468" cy="382" r="1" opacity="0.45"/>
    <circle cx="1548" cy="312" r="1.2" opacity="0.6"/><circle cx="58" cy="452" r="1" opacity="0.4"/>
    <circle cx="176" cy="498" r="1.3" opacity="0.65"/><circle cx="342" cy="466" r="1" opacity="0.4"/>
    <circle cx="604" cy="488" r="1.1" opacity="0.5"/><circle cx="886" cy="462" r="1.2" opacity="0.55"/>
    <circle cx="1136" cy="492" r="1" opacity="0.4"/><circle cx="1420" cy="474" r="1.3" opacity="0.65"/>
  </g>
  <g fill="#F5C55C">
    <circle cx="252" cy="118" r="1.4" opacity="0.8"/><circle cx="616" cy="102" r="1.2" opacity="0.6"/>
    <circle cx="1064" cy="66" r="1.4" opacity="0.75"/><circle cx="1354" cy="126" r="1.2" opacity="0.6"/>
    <circle cx="430" cy="282" r="1.1" opacity="0.55"/><circle cx="972" cy="252" r="1.1" opacity="0.5"/>
  </g>
  <!-- 4-point sparkle stars -->
  <g fill="#FFFFFF">
    <path d="M 356 92 l 2.2 6.4 6.4 2.2 -6.4 2.2 -2.2 6.4 -2.2 -6.4 -6.4 -2.2 6.4 -2.2 Z" opacity="0.9"/>
    <path d="M 1146 122 l 2 5.8 5.8 2 -5.8 2 -2 5.8 -2 -5.8 -5.8 -2 5.8 -2 Z" opacity="0.8"/>
    <path d="M 762 236 l 1.8 5.2 5.2 1.8 -5.2 1.8 -1.8 5.2 -1.8 -5.2 -5.2 -1.8 5.2 -1.8 Z" opacity="0.7"/>
  </g>

  <!-- back skyline (dim, taller) -->
  <g fill="#081028" opacity="0.75">
    <rect x="40" y="650" width="110" height="250"/>
    <rect x="200" y="600" width="90" height="300"/>
    <rect x="340" y="690" width="130" height="210"/>
    <rect x="520" y="570" width="80" height="330"/>
    <rect x="650" y="640" width="120" height="260"/>
    <rect x="820" y="550" width="100" height="350"/>
    <rect x="960" y="670" width="140" height="230"/>
    <rect x="1150" y="590" width="90" height="310"/>
    <rect x="1290" y="630" width="120" height="270"/>
    <rect x="1460" y="580" width="110" height="320"/>
  </g>
  <!-- antenna on the tallest tower -->
  <line x1="870" y1="550" x2="870" y2="492" stroke="#081028" stroke-width="4" opacity="0.75"/>
  <circle cx="870" cy="488" r="3.5" fill="#E31E24" opacity="0.85"/>

  <!-- front skyline (dark silhouettes) -->
  <g fill="#060B1C">
    <rect x="0" y="750" width="90" height="150"/>
    <rect x="140" y="710" width="120" height="190"/>
    <rect x="310" y="760" width="100" height="140"/>
    <rect x="460" y="700" width="130" height="200"/>
    <rect x="630" y="740" width="110" height="160"/>
    <rect x="780" y="690" width="140" height="210"/>
    <rect x="950" y="730" width="110" height="170"/>
    <rect x="1100" y="700" width="130" height="200"/>
    <rect x="1270" y="750" width="110" height="150"/>
    <rect x="1420" y="710" width="180" height="190"/>
  </g>

  <!-- lit windows -->
  <g fill="#F5C55C" opacity="0.75">
    <rect x="160" y="730" width="9" height="13"/><rect x="186" y="756" width="9" height="13"/>
    <rect x="216" y="730" width="9" height="13"/><rect x="242" y="782" width="9" height="13"/>
    <rect x="480" y="722" width="9" height="13"/><rect x="510" y="750" width="9" height="13"/>
    <rect x="540" y="722" width="9" height="13"/><rect x="570" y="778" width="9" height="13"/>
    <rect x="800" y="712" width="9" height="13"/><rect x="830" y="740" width="9" height="13"/>
    <rect x="888" y="712" width="9" height="13"/><rect x="736" y="762" width="9" height="13"/>
    <rect x="972" y="752" width="9" height="13"/><rect x="1002" y="780" width="9" height="13"/>
    <rect x="1120" y="722" width="9" height="13"/><rect x="1150" y="750" width="9" height="13"/>
    <rect x="1180" y="722" width="9" height="13"/><rect x="1440" y="732" width="9" height="13"/>
    <rect x="1470" y="760" width="9" height="13"/><rect x="1530" y="732" width="9" height="13"/>
  </g>
  <g fill="#E31E24" opacity="0.65">
    <rect x="172" y="806" width="9" height="13"/><rect x="498" y="804" width="9" height="13"/>
    <rect x="816" y="796" width="9" height="13"/><rect x="1136" y="806" width="9" height="13"/>
    <rect x="1456" y="816" width="9" height="13"/><rect x="986" y="722" width="9" height="13"/>
  </g>
  <g fill="#A78BFA" opacity="0.6">
    <rect x="228" y="760" width="9" height="13"/><rect x="552" y="748" width="9" height="13"/>
    <rect x="852" y="768" width="9" height="13"/><rect x="1166" y="778" width="9" height="13"/>
    <rect x="1500" y="788" width="9" height="13"/>
  </g>

  <!-- city haze -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#haze)"/>
</svg>
