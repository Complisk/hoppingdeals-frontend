    <radialGradient id="r1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E31E24" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#E31E24" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#E31E24" stop-opacity="0"/>
