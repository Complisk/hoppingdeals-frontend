<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="100%" stop-color="#050C20"/>
    </linearGradient>
    <radialGradient id="p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
