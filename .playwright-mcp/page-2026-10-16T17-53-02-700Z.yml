        - article [ref=f6e55]:
          - generic [ref=f6e56]:
            - heading "Our mission" [level=2] [ref=f6e57]
            - paragraph [ref=f6e58]: Hopping Deals is a specialized promotion platform designed to bridge the gap between businesses and consumers. Our goal is to empower business owners to create customizable promotional banners targeted to specific locations, allowing users to discover active, relevant deals based on their current category interests and geography.
          - generic [ref=f6e59]:
            - heading "The direct-to-consumer advantage" [level=2] [ref=f6e60]
            - paragraph [ref=f6e61]: We believe in a transparent marketplace. Every deal banner you see on our platform is created directly by the business owner for you. By eliminating the "middleman," Hopping Deals takes no commissions or cuts from these transactions. This allows businesses to save money on marketing and pass those direct savings on to their customers.
          - generic [ref=f6e62]:
            - heading "Our story" [level=2] [ref=f6e63]
            - paragraph [ref=f6e64]: Hopping Deals was born from real-world experience. Our founder, a former business owner, understood the immense effort and high costs required to attract new customers. For years, small local businesses have sought a technology platform that offers a simple, automated way to launch micro-promotions without the complexity of social media advertising, SEO, or traditional coupon sites. Hopping Deals is the solution to those challenges.
          - generic [ref=f6e65]:
            - heading "For shoppers" [level=2] [ref=f6e66]
            - heading "Your Local Deals, All in One Place" [level=3] [ref=f6e67]
            - paragraph [ref=f6e68]: Hopping Deals is your all-in-one platform for discovering the best deals and promotions right in your neighborhood. We partner with local merchants to bring you exclusive offers, making it easier than ever to spend consciously and save money.
            - heading "You Build the Platform" [level=3] [ref=f6e69]
            - paragraph [ref=f6e70]: Don't see your favorite local business on Hopping Deals? You have the power to change that! Simply sign up and use the Tagging feature on your Profile Page to nominate your go-to spots. Once a business receives enough tags from our community, our team will personally reach out to bring their deals directly to you.
          - generic [ref=f6e71]:
            - heading "For businesses" [level=2] [ref=f6e72]
            - paragraph [ref=f6e73]: We help business owners design, launch, and track 30-day geo-targeted campaigns in specific cities and regions with full control over timing and reach. No bidding wars. No subscriptions. No commissions. Just flat-fee promotions that run exactly where and when you choose.
            - paragraph [ref=f6e74]: Businesses create visual promotions using customizable templates or their own uploaded artwork. Text elements can be added, positioned, resized, styled, and scheduled. Promotions can be set with exact start and end dates and times, giving complete control over when offers run. Campaigns can also be created in advance and scheduled to launch automatically, allowing structured marketing without daily manual effort.
            - paragraph [ref=f6e75]: Campaigns are built around geographic reach. Every promotion begins with city-level targeting based on your campaign level, with the ability to expand to additional cities or upgrade to statewide coverage. Increased reach expands exposure, not platform access. This structure keeps pricing predictable while giving businesses scalable visibility.
            - paragraph [ref=f6e76]: Every promotion includes a unique QR code (future version release), allowing customers to scan directly from the promotion. This creates measurable engagement and trackable response. Hopping Deals provides real-time analytics so businesses can monitor views, QR scans, and overall engagement. Promotion dashboards display activity over the last 7 days, 30 days, and total campaign performance, giving clear visibility into results.
          - generic [ref=f6e77]:
            - heading "How Hopping Deals is different" [level=2] [ref=f6e78]
            - paragraph [ref=f6e79]: Traditional advertising platforms are often expensive, complicated, and unpredictable. Hopping Deals is structured around clarity and control. Each campaign runs for up to a fixed 30-day period from your selected start date. Businesses know exactly what they are paying and exactly how long their promotion will run. There are no percentage cuts from your revenue and no algorithm-driven bidding systems.
            - heading "Every campaign includes" [level=3] [ref=f6e80]
            - list [ref=f6e81]:
              - listitem [ref=f6e82]:
                - generic [ref=f6e84]: 30-day campaign run from selected start date
              - listitem [ref=f6e85]:
                - generic [ref=f6e87]: Real-time analytics to track views, scans, and engagement
              - listitem [ref=f6e88]:
                - generic [ref=f6e90]: Unique QR code for every promotion (future version release)
              - listitem [ref=f6e91]:
                - generic [ref=f6e93]: Time-based scheduling with defined start date and time (runs up to 30 days)
              - listitem [ref=f6e94]:
                - generic [ref=f6e96]: Future promotion banner launch planning – create and schedule campaigns in advance
              - listitem [ref=f6e97]:
                - generic [ref=f6e99]: City-level targeting with optional statewide upgrade
              - listitem [ref=f6e100]:
                - generic [ref=f6e102]: Custom promotion builder with full text and design controls
            - paragraph [ref=f6e103]: Hopping Deals was built from real-world business experience. We understand how difficult and costly it can be to attract new customers through traditional social media advertising, search engine ads, or coupon marketplaces. Hopping Deals provides a direct, structured alternative — predictable cost, geographic precision, measurable performance, and full control in the hands of the business owner.
